# bubble-watch overlay TEMPLATE — containers mode. dsh orchestrates; the tool server runs in its own
# container and dsh reaches it by spawning `docker run -i`.
#
# Why this shape: `docker run -i` is a LOCAL process that proxies stdio to a container, which is
# exactly what MCP stdio already expects. Nothing about the protocol changes; only who is on the
# other end of the pipe. The Hermes analyst lives inside the tool server (see hermes_tool.py for
# why it is driven over its CLI rather than ACP), so this composition has one child, not two — but
# the tool server spawns a Hermes container per call, which is why it gets the Docker socket.
#
# Trace context crosses in two hops, because a container does not inherit the parent's environment:
#   1. `config.env` puts the value on the `docker` CLI process (the MCP backend scrubs ambient
#      credential-shaped variables, so inheritance alone would lose XAI_API_KEY and friends).
#   2. `-e NAME` (no `=value`) forwards that value from the CLI into the container.
# The run's traceparent is never baked into this file — it is whatever dsh's own environment holds
# for that run, which the driver set before launching dsh.
#
# render_orchestrator_patch() fills in:
#   {mcp_image}    image to run
#   {host_root}    project root ON THE HOST (the daemon resolves -v sources, and a sibling
#                  container's mount source is always a host path)
#   {workdir}      the project root as every container sees it
# The `env:` block is generated: declaring a variable that is unset renders `undefined`, which
# dsh-mcp-client's z.union config rejects, silently dropping the whole plugin.

- insert:
    - id: mcp-bubble
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: bubble
        transport: stdio
        command: docker
        args:
          - 'run'
          - '-i'
          - '--rm'
          - '-e'
          - 'TRACEPARENT'
          - '-e'
          - 'BUBBLE_WATCH_SESSION_ID'
          - '-e'
          - 'ARIZE_SPACE_ID'
          - '-e'
          - 'ARIZE_API_KEY'
          - '-e'
          - 'ARIZE_PROJECT_NAME'
          - '-e'
          - 'ARIZE_COLLECTOR_ENDPOINT'
          - '-e'
          - 'ALPHAVANTAGE_API_KEY'
          - '-e'
          - 'XAI_API_KEY'
          - '-e'
          - 'TAVILY_API_KEY'
          - '-e'
          - 'EXA_API_KEY'
          # the analyst runs as a sibling container spawned from inside this one
          - '-e'
          - 'HERMES_BIN={workdir}/bin/hermes-docker'
          - '-e'
          - 'BUBBLE_WATCH_HOST_ROOT={host_root}'
          - '-e'
          - 'BUBBLE_WATCH_HERMES_IMAGE'
          - '-v'
          - '/var/run/docker.sock:/var/run/docker.sock'
          - '-v'
          - '{host_root}/state:{workdir}/state'
          - '-v'
          - '{host_root}/reports:{workdir}/reports'
          - '-v'
          - '{host_root}/.hermes-analyst:{workdir}/.hermes-analyst'
          - '{mcp_image}'
        cwd: '{workdir}'
        failOnStartupError: true
        toolCallTimeoutMs: 900000
{mcp_env}
