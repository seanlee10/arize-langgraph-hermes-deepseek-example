# bubble-watch overlay TEMPLATE — containers mode. Each runtime runs in its own container, and the
# orchestrator reaches each one by spawning `docker run -i`. Both rows are MCP servers, so both are
# direct children of the orchestrator: nothing spawns a sibling, and no container needs the Docker
# socket.
#
# `docker run -i` is a LOCAL process that proxies stdio, which is exactly what MCP stdio already
# expects. Nothing about the protocol changes; only who is on the other end of the pipe.
#
# Trace context crosses in two hops, because a container does not inherit its parent's environment:
#   1. `config.env` puts the value on the `docker` CLI process (the MCP backend scrubs ambient
#      credential-shaped variables, so inheritance alone would lose XAI_API_KEY and friends).
#   2. `-e NAME` forwards that value from the CLI into the container.
# EVERY name declared in `env` must also appear as `-e NAME`, or it renders as `undefined` inside
# the container and dsh-mcp-client's z.union config silently rejects the whole row. A test asserts
# this (test_every_env_var_the_containers_patch_declares_is_forwarded_into_the_container).
#
# The `env:` blocks are generated: only variables that actually have a value are declared.
#
# render_orchestrator_patch() fills in:
#   {mcp_image} {hermes_image}   images to run, one per runtime
#   {host_root}                  project root ON THE HOST — the daemon resolves every -v source
#                                against the host, wherever the CLI issuing it runs
#   {workdir}                    the project root as every container sees it

- insert:
    - id: mcp-bubble
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: bubble
        transport: stdio
        command: docker
        args:
          - 'run'
          - '-i'
          - '--rm'
          - '-e'
          - 'TRACEPARENT'
          - '-e'
          - 'BUBBLE_WATCH_SESSION_ID'
          - '-e'
          - 'ARIZE_SPACE_ID'
          - '-e'
          - 'ARIZE_API_KEY'
          - '-e'
          - 'ARIZE_PROJECT_NAME'
          - '-e'
          - 'ARIZE_COLLECTOR_ENDPOINT'
          - '-e'
          - 'ALPHAVANTAGE_API_KEY'
          - '-e'
          - 'XAI_API_KEY'
          - '-e'
          - 'TAVILY_API_KEY'
          - '-e'
          - 'EXA_API_KEY'
          - '-e'
          - 'HERMES_REPO'
          - '-v'
          - '{host_root}/state:{workdir}/state'
          - '-v'
          - '{host_root}/reports:{workdir}/reports'
          - '{mcp_image}'
        cwd: '{workdir}'
        failOnStartupError: true
        toolCallTimeoutMs: 900000
{mcp_env}

    - id: mcp-hermes
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: hermes
        transport: stdio
        command: docker
        args:
          - 'run'
          - '-i'
          - '--rm'
          - '-e'
          - 'TRACEPARENT'
          - '-e'
          - 'BUBBLE_WATCH_SESSION_ID'
          - '-e'
          - 'ARIZE_SPACE_ID'
          - '-e'
          - 'ARIZE_API_KEY'
          - '-e'
          - 'ARIZE_PROJECT_NAME'
          - '-e'
          - 'ARIZE_COLLECTOR_ENDPOINT'
          - '-e'
          - 'ALPHAVANTAGE_API_KEY'
          - '-e'
          - 'XAI_API_KEY'
          - '-e'
          - 'TAVILY_API_KEY'
          - '-e'
          - 'EXA_API_KEY'
          - '-e'
          - 'HERMES_REPO'
          - '-e'
          - 'TIRITH_ENABLED=false'
          - '-v'
          - '{host_root}/.hermes-analyst:{workdir}/.hermes-analyst'
          - '{hermes_image}'
        cwd: '{workdir}'
        failOnStartupError: true
        toolCallTimeoutMs: 900000
{mcp_env}
