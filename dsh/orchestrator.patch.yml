# bubble-watch overlay TEMPLATE — local mode. dsh orchestrates the daily run; everything it is not
# (market data, signal computation, and the Hermes analyst) sits behind one MCP tool server.
#
# render_orchestrator_patch() fills in:
#   {project_root}   the bubble-watch checkout; the MCP server's project and working directory
#   {uv_bin}         the uv executable that launches the MCP server
# The `env:` block is generated — see below.
#
# TWO TOOL SERVERS, NOT ONE. The deterministic tools and the Hermes analyst are separate servers so
# each runtime is one hop from the orchestrator and can be its own container. The alternative —
# hosting the analyst inside the tool server — makes that server spawn a sibling container, which
# means giving it the Docker socket.
#
# WHY HERMES IS NOT A SUBAGENT HERE. dsh ships an ACP subagent backend and Hermes ships an ACP
# adapter, so wiring them together is config-only and was the obvious first choice. But Hermes'
# ACP adapter builds an AIAgent directly and never touches hermes_cli's plugin dispatch, so NO
# plugin hook fires over ACP — including observability/arize, which is how Hermes traces itself.
# Driven over its one-shot CLI instead, Hermes emits its own spans into this run's trace. The MCP
# server owns a real OTel context, so it can give each call its own span to nest under.
# See src/bubble_watch/hermes_tool.py.
#
# TWO THINGS ARE LOAD-BEARING, and both fail silently.
#
# 1. dsh-mcp-client is NOT in dsh's base bundle. It must be installed into the profile package tree
#    first (`bubble-watch install-plugins`; doctor checks it). Do not "fix" an unresolved name by
#    pointing it at the checkout's lib/index.js — that loads a second copy of the plugin whose
#    config validation then fails against the bundle's copy.
#
# 2. The `env:` block is GENERATED and lists only variables that actually have a value.
#    `!!js process.env.FOO` on an unset FOO evaluates to `undefined`, and dsh-mcp-client's Config is
#    a z.union whose branch rejects an env dict containing one: the row fails validation and the
#    plugin never activates. The error's "but got" JSON hides the cause, because JSON.stringify
#    drops undefined-valued keys — every field it shows you is valid.
#
# TRACEPARENT is resolved once per run: the Python driver opens the root span BEFORE launching dsh.
# This is the only injection point the MCP backend offers — its `env` is static, read at load.

- insert:
    - id: mcp-bubble
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: bubble
        transport: stdio
        command: '{uv_bin}'
        args: ['run', '--project', '{project_root}', 'bubble-watch', 'mcp']
        cwd: '{project_root}'
        failOnStartupError: true
        toolCallTimeoutMs: 900000
{mcp_env}

    - id: mcp-hermes
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: hermes
        transport: stdio
        command: '{uv_bin}'
        args: ['run', '--project', '{project_root}', 'bubble-watch', 'hermes-mcp']
        cwd: '{project_root}'
        failOnStartupError: true
        toolCallTimeoutMs: 900000
{mcp_env}
